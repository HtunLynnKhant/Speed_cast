stages:
  - install
  - test
  - build
  - deploy

.config:
  rules:
    - if: $CI_COMMIT_REF_NAME =~ /^main$|^feature\/|^fix\//
  tags:
    - $RUNNER_TAG

.build-config:
  services:
    - docker:20.10.7-dind
  rules:
    # - if: $CI_COMMIT_REF_NAME == "main"
    - if: $CI_COMMIT_REF_NAME =~ /^main$|^feature\/|^bugfix\//
  tags:
    - $RUNNER_TAG
  # when: manual

# cache:
#   paths:
#     - vendor/

install:
  image: $CI_IMAGE
  stage: install
  extends:
    - .config
  script:
    - |
      composer install \
        --prefer-dist \
        --no-ansi \
        --no-interaction \
        --no-progress
  artifacts:
    paths:
      - vendor/
  allow_failure: false

# Check style
style-test:
  image: $CI_IMAGE
  stage: test
  extends:
    - .config
  needs:
    - install
  script:
    - ./vendor/bin/pint --test
  allow_failure: false

unit-test:
  image: $CI_IMAGE
  stage: test
  extends:
    - .config
  dependencies:
    - install
  before_script:
    - cp .env.example .env
    - php artisan key:generate
  script:
    - php vendor/bin/phpunit --colors=never
  allow_failure: false

# Feature test
feature-test:
  image: $CI_IMAGE
  stage: test
  extends:
    - .config
  needs:
    - install
  script:
    - echo 'Running feature test'
  allow_failure: false

#---------------------------
# Building container image -
#---------------------------
dev-build:
  image: docker:latest
  stage: build
  extends:
    - .build-config
  needs:
    - unit-test
    - feature-test
  before_script:
    - echo "$DOCKER_REGISTRY_PASS" | docker login docker.io --username $DOCKER_REGISTRY_USER --password-stdin
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker push $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG
    - docker rmi $DOCKER_REGISTRY/${IMAGE_NAME}:$IMAGE_TAG
  allow_failure: false

dev-deploy:
  stage: deploy
  extends:
    - .build-config
  needs:
    - dev-build
  before_script:
    - apt update
    - apt install -y openssh-client
    - mkdir -p ~/.ssh
    - echo "$DEV_SSH_PRIVATE_KEY" > ~/.ssh/speedcast_rsa
    - chmod 600 ~/.ssh/speedcast_rsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - |
      ssh -i ~/.ssh/speedcast_rsa $DEV_USER@$DEV_SERVER_IP "
        docker rm -f $DEV_CONTAINER_NAME || true;
        docker login -u $DOCKER_REGISTRY_USER -p $DOCKER_REGISTRY_PASS;
        docker pull $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG;
        docker run -dp 80:80 --name $DEV_CONTAINER_NAME $DOCKER_REGISTRY/$IMAGE_NAME:$IMAGE_TAG || true;
      "
  when: manual
  allow_failure: false
